# evoclaw-plugin-wechat — example configuration
# Copy this to ~/.evoclaw/plugins/wechat.toml (or any path you pass via --config)
# and fill in the values from 微信公众平台 → 基本配置.

[server]
# HTTP bind address. TLS is expected to be terminated by a reverse proxy
# (nginx, caddy, ...) because WeChat only POSTs to HTTPS endpoints with a
# verified ICP-filed domain. The plugin itself stays plain HTTP behind it.
bind = "127.0.0.1:8080"
# WeChat 后台配置的服务器 URL 路径,例如填 https://example.com/wechat 则:
endpoint_path = "/wechat"

[wechat]
# 公众平台 → 基本配置 → 服务器配置 → Token
token = "REPLACE_ME"

# 公众平台 → 基本配置 → 开发者ID(AppID)
app_id = "wx_REPLACE_ME"

# 公众平台 → 基本配置 → 服务器配置 → 消息加解密密钥 (EncodingAESKey)
# 明文模式留空;兼容模式 / 安全模式必须填(43 位字符)。
encoding_aes_key = ""

# "plain" | "compatible" | "safe"
# - plain      : 明文模式(EncodingAESKey 留空)
# - compatible : 兼容模式(同时接受明文和密文)
# - safe       : 安全模式(只接受密文,推荐生产使用)
encrypt_mode = "plain"

[evoclaw]
# evoclaw 二进制路径。留空则默认在 PATH 中查找 "evoclaw"。
binary = "evoclaw"

# 传给 evoclaw channel run 的额外参数。
# 推荐配置(WeChat 5s 窗口必备):
#   --no-reflection : 跳过反思轮(省 1-3s)
#   --no-tools      : 关掉所有工具,模型一次回答完(没有工具循环)
#   --max-turns 1   : 配合 --no-tools 进一步硬卡死单轮
#   --max-tokens 300: 回复短(WeChat 上限本来也是 ~2048 字节)
# 这些 flag 在 EvoClaw 1.0.1-beta.1 之后的 channel run 子命令上提供。
extra_args = [
    "--no-reflection",
    "--no-tools",
    "--max-turns", "1",
    "--max-tokens", "300",
]

# 单条消息的总超时(毫秒)。微信硬超时是 5 秒,这里默认 4500 留 500ms 余量。
timeout_ms = 4500

# 子进程池大小。
# 注意:EvoClaw 的 channel run 内部串行处理消息——worker_count=1 时,两个用户
# 几乎同时发消息,第二人 100% 会撞 5s 超时。默认 4 覆盖个人/小商户常见突发流量;
# 高并发场景再加大。每多一个 worker = 多一份 EvoClaw 进程内存开销。
worker_count = 4

# 启动期 aliveness 检查的宽限期(毫秒)。spawn 后插件等这段时间再检查每个 worker
# 是否还活着,死了就报错退出(并把子进程 stderr 一起报告出来便于诊断)。
# 默认 2000ms:覆盖 evoclaw 较慢的冷启动 + 第一次 LLM token 缓存。
# 部署到快机器上可降到 500ms;evoclaw 加载特别重的状态(大 vault 等)可调到 5000ms。
startup_grace_ms = 2000

[reply]
# 超时或后端失败时返回的兜底文案。
fallback = "我还在想这个问题,请换个简单的问法,或稍后再试一次。"

# 用户首次关注公众号时回复(subscribe 事件)。留空则不回复。
welcome = "您好!我是 AI 助手,直接发消息向我提问即可。"

# 不识别的事件类型默认是否回复(关注/取关/菜单点击等)。
# false = 静默;true = 用 reply.fallback 回复。
echo_unknown_event = false

# 回复文本最大字符数(不是字节数)。WeChat 被动回复 text 元素上限约 2048 字节,
# 600 个中文字符 ≈ 1800 字节,够 XML 信封头开销。超长回复会被截断并加省略号。
max_chars = 600

[log]
# trace | debug | info | warn | error
level = "info"

# ----------------------------------------------------------------------------
# Digest cache (offline event collection)
# ----------------------------------------------------------------------------
# 一个独立的 skill (例如 uae-events-collect) 定时把活动信息写到 data_dir 下,
# 插件读 latest/data.json 拿事实数据 → 不调 LLM 也能给出准确答案。
# enabled = false 时插件回退到"全部走 LLM"的老路径(本字段为 OFF 默认值)。
[digest]
enabled       = false
data_dir      = "/tmp/evoclaw/data"
latest_subdir = "latest"
data_file     = "data.json"
meta_file     = "meta.json"
# 超过这个秒数没更新的 digest 视为过期,插件拒绝服务过期数据。
max_age_secs  = 129600   # 36 小时

# ----------------------------------------------------------------------------
# Intent recognition (dict + optional AI fallback)
# ----------------------------------------------------------------------------
[intent]
enabled       = false
ai_fallback   = true            # dict miss 时跑一次 LLM 分类(JSON 输出)
ai_timeout_ms = 1500            # 必须 ≤ evoclaw.timeout_ms
# 覆盖默认 prompt — 留空使用内置默认(见 src/intent/ai.rs::DEFAULT_PROMPT)。
ai_prompt_override = ""

[intent.dict]
help_words   = ["菜单", "help", "?", "帮助"]
action_words = ["活动", "玩的", "节目", "推荐", "去处", "event", "攻略"]

# ----- 日期(date)维度
[[intent.dict.dates]]
words = ["今天", "今日", "今晚", "today", "tonight"]
tag   = "today"

[[intent.dict.dates]]
words = ["明天", "tomorrow"]
tag   = "tomorrow"

[[intent.dict.dates]]
words = ["周末", "this weekend", "本周末", "周六", "周日"]
tag   = "weekend"

# ----- 国家(country)维度 — 多国场景的关键
# Skills 把每条活动打上 country 标签写到 digest;插件按这里的词典
# 把用户输入的"土耳其/Turkey"映射到 canonical "Turkey"。可以无限加。
[[intent.dict.countries]]
words = ["阿联酋", "UAE", "uae"]
tag   = "UAE"

[[intent.dict.countries]]
words = ["土耳其", "Turkey", "turkey", "TR"]
tag   = "Turkey"

[[intent.dict.countries]]
words = ["尼泊尔", "Nepal", "nepal", "NP"]
tag   = "Nepal"

# ----- 城市(city)维度
# 城市标签独立于国家。用户可以问"伊斯坦布尔活动"(city only)、
# "土耳其活动"(country only)、或者"土耳其伊斯坦布尔活动"(both)。
[[intent.dict.cities]]
words = ["迪拜", "Dubai", "DXB"]
tag   = "Dubai"

[[intent.dict.cities]]
words = ["阿布扎比", "AbuDhabi", "abu dhabi", "AUH"]
tag   = "AbuDhabi"

[[intent.dict.cities]]
words = ["沙迦", "Sharjah", "SHJ"]
tag   = "Sharjah"

[[intent.dict.cities]]
words = ["伊斯坦布尔", "Istanbul", "IST"]
tag   = "Istanbul"

[[intent.dict.cities]]
words = ["安卡拉", "Ankara"]
tag   = "Ankara"

[[intent.dict.cities]]
words = ["加德满都", "Kathmandu", "KTM"]
tag   = "Kathmandu"

[[intent.dict.cities]]
words = ["博卡拉", "Pokhara"]
tag   = "Pokhara"

# ----- 类别(category)维度 — 也完全用户提供,加任何垂直都行
[[intent.dict.categories]]
words = ["艺术", "展览", "art", "exhibition", "gallery"]
tag   = "art"

[[intent.dict.categories]]
words = ["音乐", "演唱会", "concert", "music", "live"]
tag   = "music"

[[intent.dict.categories]]
words = ["美食", "餐厅", "food", "dining"]
tag   = "food"

[[intent.dict.categories]]
words = ["家庭", "亲子", "family", "kids"]
tag   = "family"

[[intent.dict.categories]]
words = ["免费", "free"]
tag   = "free"

# ----------------------------------------------------------------------------
# Router (how to turn intent + digest hit into a user-visible reply)
# ----------------------------------------------------------------------------
[router]
help_text         = "支持的问法:\n• 今天/明天/周末活动\n• <城市>活动 (例:迪拜活动)\n• <类别>活动 (例:艺术、音乐、美食)\n• 回复 help 看本菜单"
unknown_fallback  = "我没太理解 :( 请试试『今天活动』或『迪拜艺术』,或回复 help 查看菜单。"
empty_result_template = "最近 {days} 天没找到匹配的活动 :("
events_in_card    = 3

# 图文消息卡片配置。pic_url + url 必须 HTTPS + ICP 备案域名。
# 留空则 Events 意图也走纯文本回复(LIST 形式),适合还没搭好图床的过渡期。
[router.news_card]
pic_url  = ""
url      = ""
# 模板支持 4 个占位符:{count} {date} {country} {city}
# 单国场景 (例:只服务 UAE):
#   title_template = "{date}{city}有 {count} 场活动"
#   default_city_label = "全境"
# 多国场景 (UAE + 土耳其 + 尼泊尔 等):
#   title_template = "{date}{country}{city}有 {count} 场活动"
#   default_country_label = "" (留空让 {country} 不出现在标题里当用户没指定国家)
#   default_city_label = ""
title_template        = "{date}{country}{city}有 {count} 场活动"
description_separator = " · "
description_max_chars = 80

# 用户没指定城市时 {city} 替换成的字符串。留空字符串就让 {city} 渲染为空。
# 单国场景常填"全境"、"all of UAE";多国场景一般留空。
default_city_label = ""

# 用户没指定国家时 {country} 替换成的字符串。留空 = 不显示。
# 想做全球性 "Worldwide" / "全球" 兜底语就填,不想就留空。
default_country_label = ""

# 各 DateTag 的用户可见字符串。全部可自定义,改成英文 / 任意语言皆可。
[router.news_card.date_labels]
today    = "今天"
tomorrow = "明天"
weekend  = "周末"
week     = "本周"
