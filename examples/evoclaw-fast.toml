# Recommended EvoClaw config for the WeChat passive-reply plugin.
#
# NOTE: EvoClaw currently reads its config from a fixed path
# (`~/.evoclaw/config.toml`) — there is no `--config <path>` flag yet.
# So this file is a **template to copy** into that location, not a config
# the plugin can point at directly via `extra_args`.
#
# Procedure:
#   1. Back up your existing config:
#        cp ~/.evoclaw/config.toml ~/.evoclaw/config.toml.bak
#   2. Replace with this template:
#        cp examples/evoclaw-fast.toml ~/.evoclaw/config.toml
#   3. Fill in your real api-key under [auth] (or use the vault).
#   4. Run `evoclaw doctor` to confirm it parses.
#
# What we CAN tune via this file (limits the 5-second budget):
#
#   * model.provider / model.default — pick a fast model. DeepSeek's
#     `deepseek-chat` typically replies in 1-2s; GPT-4o-mini is similar;
#     Qwen Turbo even faster for short Chinese answers.
#
# What we CANNOT tune via this file today:
#
#   * `max_turns`, `max_tokens`, `temperature`, `reflection_enabled` —
#     these are `RuntimeConfig` fields baked into EvoClaw's defaults
#     (25 turns / 4096 tokens / 0.2 / reflection ON). They cannot be
#     overridden from config.toml in current EvoClaw. With reflection
#     enabled, every channel message costs an extra ~1-3 second LLM
#     round, which eats into the 5s WeChat budget.
#
#     If your replies frequently timeout, ask the EvoClaw maintainers
#     to expose CLI flags on `evoclaw channel run` (e.g. `--no-reflection
#     --max-turns 1`), then add them to `evoclaw.extra_args` in
#     ~/.evoclaw/plugins/wechat.toml. Tracked as an upstream feature
#     request; this plugin's bridge already passes `extra_args` through.
#
# What about tool calling?
#
#   `channel run` registers ALL built-in tools by default. A fast small
#   model usually just answers in turn 1 for plain conversational input,
#   but if your prompts encourage tool use (e.g. "search the web for…"),
#   you'll trip the 5s budget. Keep the public-account persona simple.

[model]
provider = "deepseek"
default  = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
fallback = []

[auth]
# `api_key`, `apikey`, or `key` all map to the same enum. Use one.
# The actual key comes from $DEEPSEEK_API_KEY or ~/.evoclaw/vault.toml —
# never put it in plaintext here.
method = "api_key"

[budget]
# These are advisory budgets. Set them generously for WeChat traffic so
# the bridge doesn't get blocked mid-conversation. Tighten later if you
# want hard spending caps.
per_task_usd  = 0.02
per_day_usd   = 5.0
per_month_usd = 50.0

[security]
# P1 = "allow most read-only operations without prompting". Channel mode
# already disables ask-user prompts (`allow_user_prompt = false`), so
# higher trust levels here mainly affect manual CLI sessions.
default_permission   = "P1"
high_risk_intercept  = true

# Optional logging override.
# [logs]
# dir = "~/.evoclaw/logs"
